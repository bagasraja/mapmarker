<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Interaktif dengan Marker</title>
    
    <!-- Memanggil CSS dari Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <style>
        /* Mengatur agar peta memenuhi layar */
        body {
            margin: 0;
            padding: 0;
        }
        #map {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!-- Wadah untuk Peta -->
    <div id="map"></div>

    <!-- Memanggil JavaScript dari Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // 1. Inisialisasi Peta
        // Set koordinat awal [Latitude, Longitude] dan level zoom (13)
        // Koordinat di bawah ini mengarah ke Surabaya
        var map = L.map('map').setView([-7.250445, 112.768845], 13);

        // 2. Menambahkan Layer Peta dari OpenStreetMap (Gratis & Tanpa API Key)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // 3. Menambahkan Marker Bawaan
        L.marker([-7.250445, 112.768845]).addTo(map)
            .bindPopup('<b>Halo!</b><br>Ini marker pertama.')
            .openPopup();

        // 4. Fitur Klik Peta untuk Menambah Marker Baru
        map.on('click', function(e) {
            // Mengambil titik koordinat yang diklik
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            // Membuat marker baru di titik tersebut
            L.marker([lat, lng]).addTo(map)
                .bindPopup('Marker baru ditambahkan di:<br>Lat: ' + lat.toFixed(4) + '<br>Lng: ' + lng.toFixed(4))
                .openPopup();
        });
    </script>
</body>
</html>
